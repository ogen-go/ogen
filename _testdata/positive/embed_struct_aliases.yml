openapi: 3.0.3
info:
  title: Embed struct aliases
  version: 1.0.0
paths:
  /pets:
    post:
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        "200":
          description: Existing pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        "201":
          description: Created pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
components:
  schemas:
    Pet:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 10
        tag:
          type: string
