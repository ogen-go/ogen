openapi: 3.1.0
info:
  title: Required recursive properties
  version: 1.0.0
paths:
  /probe:
    post:
      operationId: probe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/A'
      responses:
        '204':
          description: No content
components:
  schemas:
    A:
      oneOf:
        - $ref: '#/components/schemas/ARecursive'
        - $ref: '#/components/schemas/ALeaf'
    ARecursive:
      type: object
      required: [b]
      properties:
        b:
          $ref: '#/components/schemas/B'
    B:
      type: object
      required: [a]
      properties:
        a:
          $ref: '#/components/schemas/A'
    ALeaf:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [leaf]
